# ---------------------------------------------------------------
# Smart City Pollution Hotspot Detection - configuration
# ---------------------------------------------------------------

project:
  name: "Smart City Pollution Hotspot Detection"
  timezone: "Asia/Kolkata"

# Historical window to ingest. end_date "auto" = yesterday. Weather comes from
# the ERA5 archive, with the last ~6 days filled from the forecast API.
ingestion:
  start_date: "2025-10-01"
  end_date: "auto"
  # auto      -> OpenAQ if OPENAQ_API_KEY is set, else hybrid, else synthetic
  # openaq    -> OpenAQ v3 ground stations (needs OPENAQ_API_KEY env var)
  # hybrid    -> real Open-Meteo/CAMS background + real weather, downscaled to
  #              each site with land-use emission factors (no key needed)
  # openmeteo -> raw CAMS grid (~3 distinct cells over Mumbai/Thane)
  # synthetic -> offline simulator (no internet needed)
  source: "auto"
  openaq_radius_m: 25000
  request_timeout_s: 60

pollutants: ["pm2_5", "pm10", "no2", "so2", "co", "o3"]
weather_vars: ["temperature", "humidity", "wind_speed", "wind_direction", "precipitation", "pressure"]

