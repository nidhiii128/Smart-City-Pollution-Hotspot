clustering:
  k_min: 3
  k_max: 6
  seed: 42

prediction:
  horizon_days: 7
  test_fraction: 0.2
  targets: ["pm2_5", "aqi"]
  seed: 42

spark:
  app_name: "PollutionHotspotDetection"
  master: "local[*]"
  driver_memory: "4g"
  shuffle_partitions: 16

mongodb:
  # Override with MONGO_URI env var
  uri: "mongodb://localhost:27017"
  database: "smart_city_pollution"

paths:
  raw: "data/raw"
  processed: "data/processed"
  models: "models"
